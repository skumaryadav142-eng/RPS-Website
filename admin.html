<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPS Admin</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#123b63;color:#fff;padding:18px 6%}main{max-width:1100px;margin:auto;padding:25px}.box{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px #0001}input,button{padding:11px;margin:6px 0;border-radius:7px;border:1px solid #ccc;width:100%;box-sizing:border-box}button{background:#123b63;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.num{font-size:30px;font-weight:bold;color:#123b63}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}.msg{color:#555}</style></head><body><header><h1>RPS Admin Dashboard</h1><div>Secure Member Management</div></header><main><div class="box" id="loginBox"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg" class="msg"></p></div><div id="dash" style="display:none"><div class="grid"><div class="box">Total Members<div id="total" class="num">0</div></div><div class="box">Today's Registrations<div id="today" class="num">0</div></div><div class="box">Referral Records<div id="refs" class="num">0</div></div></div><div class="box"><button onclick="loadMembers()">Refresh Members</button><button onclick="logout()">Logout</button><input id="search" placeholder="Search name / mobile / city / referral" oninput="render()"><div class="scroll"><table><thead><tr><th>Name</th><th>Mobile</th><th>City</th><th>Referral</th><th>Interest</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div><p id="msg" class="msg"></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let sb,members=[];function init(){if(!SUPABASE_PUBLISHABLE_KEY||SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')){document.getElementById('loginMsg').textContent='पहले supabase-config.js में Publishable key डालें।';return false}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return true}async function login(){if(!init())return;let email=document.getElementById('email').value,password=document.getElementById('password').value;let r=await sb.auth.signInWithPassword({email,password});if(r.error){document.getElementById('loginMsg').textContent=r.error.message;return}document.getElementById('loginBox').style.display='none';document.getElementById('dash').style.display='block';loadMembers()}async function loadMembers(){let r=await sb.from('members').select('*').order('created_at',{ascending:false});if(r.error){document.getElementById('msg').textContent=r.error.message;return}members=r.data||[];document.getElementById('total').textContent=members.length;let d=new Date().toISOString().slice(0,10);document.getElementById('today').textContent=members.filter(x=>x.created_at.slice(0,10)===d).length;document.getElementById('refs').textContent=members.filter(x=>x.referral_id).length;render()}function render(){let q=(document.getElementById('search')?.value||'').toLowerCase();let f=members.filter(x=>`${x.name} ${x.mobile} ${x.city||''} ${x.referral_id||''}`.toLowerCase().includes(q));document.getElementById('rows').innerHTML=f.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${esc(x.city||'')}</td><td>${esc(x.referral_id||'')}</td><td>${esc(x.interest||'')}</td><td>${new Date(x.created_at).toLocaleString('hi-IN')}</td></tr>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function logout(){if(sb)await sb.auth.signOut();location.reload()}</script></body></html>
